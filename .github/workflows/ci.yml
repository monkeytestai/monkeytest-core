name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Layer 1: unit tests and the stub-LLM demo fixture. No API keys.
      # A real-model run lives in e2e-live.yml and does not run on pull_request.
      - run: npm test
      - run: npm run build
      - name: Verify the build emitted JavaScript
        run: test -f dist/cli.js && test -f dist/index.js
      - name: Verify package can be packed
        run: npm pack --dry-run

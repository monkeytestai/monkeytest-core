name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Layer 1: unit tests and the stub-LLM demo fixture. No API keys.
      # A real-model run lives in e2e-live.yml and does not run on pull_request.
      - run: npm test
      - run: npm run build
      - name: Verify the build emitted JavaScript
        run: test -f dist/cli.js && test -f dist/index.js
      - name: Verify package can be packed
        run: npm pack --dry-run

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime image
        run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -t monkeytester:ci .
      - name: CLI help works with no API key
        run: docker run --rm monkeytester:ci --help
      - name: Artifact imports and can be installed as a file dependency
        run: |
          docker run --rm --entrypoint bash monkeytester:ci -lc '
            set -euo pipefail
            test ! -e /opt/monkeytester/.env
            test ! -d /opt/monkeytester/src
            test ! -d /opt/monkeytester/node_modules/typescript
            test ! -d /opt/monkeytester/node_modules/vitepress
            test ! -d /root/.cache/ms-playwright
            node --input-type=module -e "import { Monkey } from \"/opt/monkeytester/dist/index.js\"; if (typeof Monkey !== \"function\") process.exit(1);"
            node --input-type=module -e "import { readFileSync } from \"node:fs\"; const p = JSON.parse(readFileSync(\"/opt/monkeytester/package.json\", \"utf8\")); if (p.scripts && p.scripts.prepack) { console.error(\"prepack must be stripped\"); process.exit(1); } if (p.name !== \"@monkeytestai/monkeytester\") process.exit(1); console.log(p.name, p.version);"
            mkdir -p /tmp/consumer
            cd /tmp/consumer
            npm init -y >/dev/null
            npm pkg set dependencies.@monkeytestai/monkeytester=file:/opt/monkeytester
            npm install --omit=dev --no-audit --no-fund
            node --input-type=module -e "import { createRequire } from \"node:module\"; import { Monkey } from \"@monkeytestai/monkeytester\"; if (typeof Monkey !== \"function\") process.exit(1); const require = createRequire(import.meta.resolve(\"@monkeytestai/monkeytester\")); const pw = require.resolve(\"playwright/package.json\"); if (!pw.startsWith(\"/opt/monkeytester/\")) { console.error(pw); process.exit(1); } console.log(\"file-link\", Monkey.name);"
            mkdir -p /tmp/pack /tmp/app
            npm pack --ignore-scripts --pack-destination /tmp/pack /opt/monkeytester
            cd /tmp/app
            npm init -y >/dev/null
            npm install --omit=dev --no-audit --no-fund /tmp/pack/monkeytestai-monkeytester-*.tgz
            node --input-type=module -e "import { createRequire } from \"node:module\"; import { Monkey } from \"@monkeytestai/monkeytester\"; if (typeof Monkey !== \"function\") process.exit(1); const require = createRequire(import.meta.resolve(\"@monkeytestai/monkeytester\")); const pw = require.resolve(\"playwright/package.json\"); if (!pw.startsWith(\"/tmp/app/\")) { console.error(pw); process.exit(1); } console.log(\"tarball-install\", Monkey.name);"
          '

# Build the VitePress site and upload the static artifact.
# Production (docs.monkeytest.ai) is a separate Vercel project. This workflow
# does not deploy. Clean URLs come from /vercel.json (`cleanUrls: true`);
# netlify.toml and docs/public/_redirects are not read by Vercel.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/.vitepress/dist

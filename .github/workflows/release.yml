name: Release to npm

# Triggered by pushing a tag like `v0.3.0`. The job:
#   1. Builds the engine with a clean install.
#   2. Verifies the package.json version matches the pushed tag.
#   3. Publishes to npm with --provenance, signing the tarball with
#      Sigstore so consumers can verify it was built by this exact
#      workflow run.
#
# Required GitHub repository setup:
#   - Settings → Secrets and variables → Actions → NPM_TOKEN
#     (npm "Automation" token with publish access to @monkeytestai/*)
#   - npm package access set to "publishConfig.access: public" (already
#     in package.json so Restricted scopes don't block publish).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.3.0)'
        required: true

permissions:
  contents: write   # create the GitHub release after npm publish
  id-token: write   # required for npm provenance attestations

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify tag matches package.json
        id: package_version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag version:     $TAG_VERSION"
          echo "package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Verify the build emitted JavaScript
        run: test -f dist/cli.js && test -f dist/index.js

      - name: Pack (sanity check)
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            See [`CHANGELOG.md`](./CHANGELOG.md) for the full list of changes.

            **Install:**

            ```bash
            npm install @monkeytestai/monkeytester@${{ steps.package_version.outputs.version }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

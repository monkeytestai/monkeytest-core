# VitePress docs → docs.monkeytest.ai
# Connect this repo in Netlify; settings below are applied automatically.

[build]
  command = "npm ci && npm run docs:build"
  publish = "docs/.vitepress/dist"

[build.environment]
  NODE_VERSION = "20"

# VitePress cleanUrls emit .html files. Pretty paths were 404ing for crawlers.
[[redirects]]
  from = "/guide/introduction"
  to = "/guide/introduction.html"
  status = 200
